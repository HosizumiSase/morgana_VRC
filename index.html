<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRC Morgana</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
    /* 余白を完全にゼロにする */
    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #0f0518; 
    }
    iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block; 
    }
</style>
</head>
<body style="margin:0">
    <iframe id="morgana-frame" src="" style="width:100vw; height:100vh; border:none;"></iframe>

    <script>
      (function() {
        // GASウェブアプリのURL
        var GAS_URL = "https://script.google.com/macros/s/AKfycbyqGgq98343gYH8qcG8rrkCBYkxPgPZozocAUEK7fxyN4tmHXWRwd0aeGPVtXJ9_xeg/exec";

        // 1. パラメータを取得
        var params = new URLSearchParams(window.location.search);
        var castId = params.get('id');
        var castName = params.get('name'); // ★追加: 名前も取得

        // 2. iframe要素を取得
        var iframe = document.getElementById("morgana-frame");

        // 3. GASへのパスを作成
        // IDがあればID優先、なければ名前を確認
        if (castId) {
          iframe.src = GAS_URL + "?id=" + castId;
        } else if (castName) {
          // 日本語が含まれるのでエンコードして渡す
          iframe.src = GAS_URL + "?name=" + encodeURIComponent(castName);
        } else {
          iframe.src = GAS_URL;
        }
      })();
    </script>
</body>
</html>
