<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRC Morgana</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
    /* 余白を完全にゼロにする */
    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #0f0518; 
    }
    iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block; 
    }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X7VJNXY119"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-X7VJNXY119');
</script>
<body style="margin:0">
    <iframe id="morgana-frame" src="" style="width:100vw; height:100vh; border:none;"></iframe>

<script>
  (function() {
    var GAS_URL = "https://script.google.com/macros/s/AKfycbyqGgq98343gYH8qcG8rrkCBYkxPgPZozocAUEK7fxyN4tmHXWRwd0aeGPVtXJ9_xeg/exec"; // ★あなたのGAS URL

    var params = new URLSearchParams(window.location.search);
    var castId = params.get('id');
    var castName = params.get('name');
    var diaryId = params.get('diary'); // ★追加: 日記IDも取得

    var iframe = document.getElementById("morgana-frame");

    // URL組み立て
    var newSrc = GAS_URL;
    var query = [];

    if (castId) query.push("id=" + castId);
    if (castName) query.push("name=" + encodeURIComponent(castName));
    if (diaryId) query.push("diary=" + diaryId); // ★追加

    if (query.length > 0) {
      newSrc += "?" + query.join("&");
    }

    iframe.src = newSrc;
  })();
</script>
</body>
</html>
